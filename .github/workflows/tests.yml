name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite uses invented fixtures and blocks network connections; no
      # API keys are needed and nothing here calls a paid service.
      - name: Run tests
        run: pytest -q

      - name: Check local UI file boundaries
        run: python scripts/smoke_ui.py

      - name: Audit installed dependencies
        run: python -m pip_audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check peiyin tests

  hygiene:
    # Guards the rules this project ships under: no voice ids, no secrets, no
    # media, no personal paths. A regression here should fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hardcoded voice ids outside tests
        run: |
          if grep -rIEn '\b[0-9a-f]{32}\b' peiyin/; then
            echo "::error::a 32-char voice id is hardcoded"; exit 1
          fi
      - name: No API keys or personal paths
        run: |
          if grep -rIEn 'sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}|/Users/|/home/[a-z]' \
             peiyin/ scripts/; then
            echo "::error::a key or a personal path is committed"; exit 1
          fi
      - name: No media, transcript or subtitle files
        run: |
          if find . -path ./.git -prune -o \
               \( -name '*.mp4' -o -name '*.mkv' -o -name '*.srt' \
                  -o -name '*.wav' -o -name '*.mp3' \) -print | grep .; then
            echo "::error::media or subtitle files are committed"; exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify wheel profiles and notices
        run: python scripts/check_wheel.py
