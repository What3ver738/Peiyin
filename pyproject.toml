[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peiyin"
dynamic = ["version"]
description = "Mandarin-optimised AI dubbing for language learners"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "DISCLAIMER.md", "docs/MODEL-PROVENANCE.md"]
requires-python = ">=3.10,<3.13"
keywords = ["dubbing", "tts", "language-learning", "whisper", "mandarin", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Education",
]
dependencies = [
    "gradio==6.27.0",
    "pillow>=12.3,<13",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "huggingface_hub==1.31.0",
    "faster-whisper>=1.0",
    "httpx>=0.24",
    "sherpa-onnx>=1.10",
    "numpy",
    "soundfile",
    "imageio-ffmpeg",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "build", "pip-audit"]

[project.scripts]
peiyin = "peiyin.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "peiyin.__version__"}

[tool.setuptools.packages.find]
include = ["peiyin*"]

[tool.setuptools.package-data]
peiyin = ["data/profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Deliberately focused: real errors, undefined names, unused code and import
# order. Style beyond that is left alone -- most of this codebase was moved
# verbatim out of a working single-file app, and churning it to satisfy a
# preview lint rule would risk behaviour for no benefit.
select = ["E4", "E7", "E9", "F", "W", "I"]
